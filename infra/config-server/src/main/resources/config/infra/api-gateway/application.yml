spring:
  cloud:
    gateway:
      routes:
        - id: main-service-admin-read
          uri: lb://main-service
          predicates:
            - Path=/admin/events/**,/admin/users/**
            - Method=GET
          filters:
            - name: Retry
              args:
                retries: 2
                statuses:
                  - BAD_GATEWAY
                  - SERVICE_UNAVAILABLE
                  - GATEWAY_TIMEOUT
                methods:
                  - GET
                backoff:
                  firstBackoff: 100ms
                  maxBackoff: 500ms

        - id: main-service-admin
          uri: lb://main-service
          predicates:
            - Path=/admin/**

        - id: main-service-read
          uri: lb://main-service
          predicates:
            - Path=/events/**,/users/**,/user/**,/compilations/**,/categories/**
            - Method=GET
          filters:
            - name: Retry
              args:
                retries: 2
                statuses:
                  - BAD_GATEWAY
                  - SERVICE_UNAVAILABLE
                  - GATEWAY_TIMEOUT
                methods:
                  - GET
                backoff:
                  firstBackoff: 100ms
                  maxBackoff: 500ms

        - id: main-service-routes
          uri: lb://main-service
          predicates:
            - Path=/events/**,/users/**,/user/**,/compilations/**,/categories/**

eureka:
  client:
    registry-fetch-interval-seconds: 5

management:
  endpoints:
    web:
      exposure:
        include: health,info

server:
  port: 8080