spring:
  main:
    banner-mode: off
    log-startup-info: false
  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: 2000
            readTimeout: 3000
            loggerLevel: basic

logging:
  level:
    ru.practicum: INFO
    org.springframework: WARN

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/